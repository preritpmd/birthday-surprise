<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Amulya 🎉</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Poppins',sans-serif;
  background:radial-gradient(circle at top,#0b1d3a,#050b18,#000);
  color:#ffd36b;
  overflow-x:hidden;
}

/* ================= DECORATIONS ================= */
.shape{
  position:fixed;
  opacity:.35;
  pointer-events:none;
  animation:float 16s linear infinite;
}
.circle{width:140px;height:140px;border:2px solid gold;border-radius:50%}
.heart{font-size:26px;color:#ff6f91}
.star{font-size:22px;color:#ffd36b}

@keyframes float{
  from{transform:translateY(120vh) rotate(0deg)}
  to{transform:translateY(-160vh) rotate(360deg)}
}

/* SPARKLES */
.sparkle{
  position:fixed;
  width:4px;height:4px;
  background:#9ecbff;
  border-radius:50%;
  animation:spark 6s linear infinite;
}
@keyframes spark{
  from{transform:translateY(100vh);opacity:0}
  to{transform:translateY(-120vh);opacity:1}
}

/* BALLOONS */
.balloon{
  position:fixed;
  bottom:-120px;
  width:36px;height:48px;
  border-radius:50%;
  animation:rise 14s linear infinite;
}
.balloon::after{
  content:"";
  position:absolute;
  bottom:-20px;
  left:50%;
  width:1px;height:20px;
  background:white;
}
@keyframes rise{
  to{transform:translateY(-160vh)}
}

/* CONFETTI */
.confetti{
  position:fixed;
  width:8px;height:8px;
  animation:confetti 6s linear infinite;
}
@keyframes confetti{
  to{transform:translateY(120vh) rotate(360deg)}
}

/* ================= PASSWORD ================= */
#passwordScreen{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle,#2b0a55,#000);
  z-index:999;
}

.card{
  width:340px;
  padding:36px;
  border-radius:26px;
  background:linear-gradient(180deg,#0d1326,#04060f);
  box-shadow:0 0 80px rgba(255,215,120,.35);
  text-align:center;
  animation:pop .8s ease;
}
@keyframes pop{
  from{opacity:0;transform:scale(.8)}
  to{opacity:1;transform:scale(1)}
}

.card h1{
  font-family:'Cinzel',serif;
  letter-spacing:3px;
}

input{
  width:100%;
  padding:14px;
  margin:18px 0;
  border:none;
  border-radius:16px;
  background:#11162b;
  color:#9ecbff;
  font-size:1rem;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:30px;
  background:linear-gradient(90deg,#ffb703,#ffd36b);
  font-weight:600;
  cursor:pointer;
  box-shadow:0 10px 30px rgba(255,200,80,.6);
}

/* ================= SECTIONS ================= */
.hidden{display:none}
section{text-align:center;padding:30px}

/* ================= BANNER ================= */
.banner{
  margin:30px auto;
  padding:24px;
  background:linear-gradient(90deg,#0b1d3a,#1b3b6f,#0b1d3a);
  border-radius:18px;
  box-shadow:0 0 60px rgba(120,180,255,.35);
}
.banner h1{
  font-family:'Cinzel',serif;
  letter-spacing:5px;
  text-shadow:0 0 30px gold;
}

/* ================= CAKE ================= */
.cake{
  width:260px;
  margin:30px auto;
}
.candles{display:flex;gap:18px;justify-content:center}
.candle{
  width:12px;height:42px;background:#fff3d6;border-radius:6px;position:relative;
}
.flame{
  position:absolute;top:-16px;left:50%;transform:translateX(-50%);
  width:10px;height:16px;
  background:radial-gradient(circle,#fff,#ff9f00);
  border-radius:50%;
  animation:flicker 1s infinite alternate;
  cursor:pointer;
}
@keyframes flicker{to{transform:translateX(-50%) scale(1.3)}}

.layer{margin:6px auto;border-radius:16px;position:relative}
.layer::after{
  content:"";
  position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
  width:75%;height:6px;
  background:radial-gradient(circle,#ffd36b 45%,transparent 46%);
}
.small{width:80px;height:42px;background:#ff9bbf}
.medium{width:120px;height:52px;background:#e1c1ff}
.large{width:170px;height:62px;background:#ff8fab}
.base{
  width:220px;height:72px;background:#8faaff;
  border-radius:18px;cursor:pointer;
}

/* ================= FINAL PAGE ================= */
.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  max-width:520px;
  margin:30px auto;
}
.photo{
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 16px 40px rgba(0,0,0,.7);
}
.photo img{width:100%;height:100%;object-fit:cover}

.wish{
  margin-top:26px;
  font-size:1.05rem;
  line-height:1.8;
  text-shadow:0 0 16px rgba(255,215,120,.5);
}
</style>
</head>

<body>

<script>
/* DECOR GENERATORS */
["circle","heart","star"].forEach(t=>{
  for(let i=0;i<10;i++){
    let d=document.createElement("div");
    d.className="shape "+t;
    d.innerHTML=t==="heart"?"♥":t==="star"?"✦":"";
    d.style.left=Math.random()*100+"vw";
    document.body.appendChild(d);
  }
});

for(let i=0;i<40;i++){
  let s=document.createElement("div");
  s.className="sparkle";
  s.style.left=Math.random()*100+"vw";
  document.body.appendChild(s);
}

["#ff6f91","#6fa8ff","#ffd36b"].forEach(c=>{
  for(let i=0;i<6;i++){
    let b=document.createElement("div");
    b.className="balloon";
    b.style.background=c;
    b.style.left=Math.random()*100+"vw";
    document.body.appendChild(b);
  }
});

for(let i=0;i<30;i++){
  let c=document.createElement("div");
  c.className="confetti";
  c.style.background=`hsl(${Math.random()*360},100%,50%)`;
  c.style.left=Math.random()*100+"vw";
  document.body.appendChild(c);
}
</script>

<!-- PASSWORD -->
<div id="passwordScreen">
  <div class="card">
    <h1>Special Surprise 🔐</h1>
    <input id="pass" type="password" placeholder="Enter password">
    <button onclick="unlock()">Unlock 🎁</button>
  </div>
</div>

<!-- PAGE 1 -->
<section id="cakePage" class="hidden">
  <div class="banner"><h1>🎉 HAPPY BIRTHDAY AMULYA 🎉</h1></div>
  <p>Blow all candles 🎂</p>

  <div class="cake">
    <div class="candles">
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
    </div>
    <div class="layer small"></div>
    <div class="layer medium"></div>
    <div class="layer large"></div>
    <div class="layer base" id="cutCake"></div>
  </div>

  <p id="status">5 candles remaining</p>
</section>

<!-- PAGE 2 -->
<section id="finalPage" class="hidden">
  <div class="banner"><h1>🎉 HAPPY BIRTHDAY AMULYA 🎉</h1></div>

  <div class="gallery">
    <div class="photo"><img src="pic1.jpg"></div>
    <div class="photo"><img src="pic2.jpg"></div>
    <div class="photo"><img src="pic3.jpg"></div>
    <div class="photo"><img src="pic4.jpg"></div>
  </div>

  <div class="wish">
    May your days sparkle brighter than fireworks,<br>
    your smile glow like golden lights,<br>
    and your life be filled with love & success 💙✨<br><br>
    <b>Happy Birthday Amulya 🎂🎉</b>
  </div>
</section>

<script>
const CORRECT_PASSWORD="AMULYA123";
function unlock(){
  if(pass.value===CORRECT_PASSWORD){
    passwordScreen.style.display="none";
    cakePage.classList.remove("hidden");
  }
}

/* Candle logic */
let flames=document.querySelectorAll(".flame");
let remaining=flames.length;
flames.forEach(f=>{
  f.onclick=()=>{
    f.style.opacity=0;
    remaining--;
    status.innerText=remaining+" candles remaining";
  }
});

/* Cut cake */
cutCake.onclick=()=>{
  if(remaining===0){
    cakePage.classList.add("hidden");
    finalPage.classList.remove("hidden");
  }else alert("Blow all candles first 🎂");
};
</script>

</body>
</html>
