<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday</title>

<style>
:root{
  --gold:#d4af37;
  --text:rgba(255,255,255,.9);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:"Inter",system-ui,sans-serif;
  background:#05060f;
  overflow-x:hidden;
  overflow-y:auto;
  color:var(--text);
  scroll-behavior:smooth;
}

/* ===== BACKGROUND ===== */
.bg{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 10%,#1a1d3a,transparent 60%),
    radial-gradient(circle at 80% 30%,#2a1b3d,transparent 55%),
    radial-gradient(circle at 50% 80%,#11152d,transparent 60%);
  z-index:0;
}

/* ===== FIREWORKS ===== */
canvas{
  position:fixed;
  inset:0;
  z-index:1;
  opacity:.45;
}

/* ===== BALLOONS ===== */
.balloons{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}

.balloon{
  position:absolute;
  bottom:-120px;
  width:48px;
  height:62px;
  border-radius:50% 50% 48% 48%;
  animation:floatUp linear infinite;
  opacity:.85;
}

.balloon::after{
  content:"";
  position:absolute;
  bottom:-35px;
  left:50%;
  width:2px;
  height:35px;
  background:rgba(255,255,255,.4);
  transform:translateX(-50%);
}

@keyframes floatUp{
  from{transform:translateY(0)}
  to{transform:translateY(-130vh)}
}

/* ===== PASSWORD SCREEN ===== */
#password-screen{
  position:fixed;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(5,6,15,.88);
  backdrop-filter:blur(20px);
}

.password-box{
  padding:40px 30px;
  border-radius:28px;
  background:rgba(255,255,255,.08);
  box-shadow:0 30px 80px rgba(0,0,0,.6);
  text-align:center;
}

.password-box h1{
  background:linear-gradient(90deg,var(--gold),#fff);
  -webkit-background-clip:text;
  color:transparent;
}

.password-box input{
  width:240px;
  padding:12px;
  border-radius:16px;
  border:none;
  outline:none;
  text-align:center;
}

.password-box button{
  margin-top:20px;
  padding:12px 26px;
  border-radius:18px;
  border:none;
  cursor:pointer;
  background:linear-gradient(90deg,var(--gold),#fff);
}

.error{
  color:#ff9aa2;
  margin-top:10px;
  display:none;
}

/* ===== MAIN LAYOUT ===== */
main{
  position:relative;
  z-index:2;
  min-height:100vh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  padding:40px 24px;
}

header{text-align:center}

header h1{
  font-size:clamp(32px,6vw,52px);
  font-weight:500;
  background:linear-gradient(90deg,var(--gold),#fff);
  -webkit-background-clip:text;
  color:transparent;
}

header h2{
  margin-top:10px;
  font-weight:300;
  opacity:.85;
}

/* ===== CENTER ===== */
.center{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

/* ===== CANDLE ===== */
.candle-wrap{
  position:relative;
  width:70px;
  height:240px;
  cursor:pointer;
}

.candle{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:46px;
  height:170px;
  background:linear-gradient(to right,#f7f1e6,#eadfc8,#fff4dd);
  border-radius:24px;
  box-shadow:inset -6px 0 10px rgba(0,0,0,.25),
             inset 6px 0 10px rgba(255,255,255,.5);
}

.wick{
  position:absolute;
  bottom:170px;
  left:50%;
  transform:translateX(-50%);
  width:3px;
  height:22px;
  background:#222;
}

.flame{
  position:absolute;
  bottom:195px;
  left:50%;
  transform:translateX(-50%);
  width:30px;
  height:55px;
  background:radial-gradient(
    ellipse at center,
    #fffbd5 0%,
    #ffd54f 40%,
    #ff9800 70%,
    #ff5722 100%
  );
  border-radius:50%;
  animation:flicker .14s infinite;
  filter:drop-shadow(0 0 45px rgba(255,160,60,.9));
}

@keyframes flicker{
  0%{transform:translateX(-50%) scale(1)}
  50%{transform:translateX(-50%) scale(1.1)}
  100%{transform:translateX(-50%) scale(1)}
}

.smoke{
  position:absolute;
  bottom:200px;
  left:50%;
  width:18px;
  height:18px;
  background:rgba(200,200,200,.6);
  border-radius:50%;
  opacity:0;
}

.smoke.active{
  animation:smoke 3.5s ease forwards;
}

@keyframes smoke{
  from{opacity:.7;transform:translate(-50%,0) scale(1)}
  to{opacity:0;transform:translate(-50%,-160px) scale(3)}
}

/* ===== POSTER ===== */
.poster{
  display:none;
  width:100%;
  max-width:520px;
  margin-top:40px;
  animation:reveal 1.6s ease forwards;
}

.poster img{
  width:100%;
  border-radius:32px;
}

@keyframes reveal{
  from{opacity:0;transform:scale(.9)}
  to{opacity:1;transform:scale(1)}
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  max-width:520px;
  margin:40px auto 0;
  font-size:16px;
  line-height:1.6;
  opacity:.9;
}
</style>
</head>

<body>

<div class="bg"></div>
<canvas id="fireworks"></canvas>
<div class="balloons" id="balloons"></div>

<!-- PASSWORD -->
<div id="password-screen">
  <div class="password-box">
    <h1>Private Access</h1>
    <input type="password" id="password" placeholder="Password">
    <br>
    <button onclick="unlock()">Unlock</button>
    <div class="error" id="error">Wrong password</div>
  </div>
</div>

<main>
  <header>
    <h1>Happy Birthday</h1>
    <h2>Amulya </h2>
  </header>

  <section class="center">
    <div class="candle-wrap" onclick="blow()">
      <div class="flame" id="flame"></div>
      <div class="wick"></div>
      <div class="candle"></div>
      <div class="smoke" id="smoke"></div>
    </div>

    <div class="poster" id="poster">
      <img src="poster.jpeg" alt="Birthday Poster">
    </div>
  </section>

  <footer>
  Enjoy your day, celebrate big, hope all your wishes come true, wishing you joy & laughter, happy year ahead!
  </footer>
</main>

<script>
/* PASSWORD */
const PASSWORD="9320943495";
function unlock(){
  if(document.getElementById("password").value===PASSWORD){
    document.getElementById("password-screen").style.display="none";
  }else{
    document.getElementById("error").style.display="block";
  }
}

/* BALLOONS */
const balloons=document.getElementById("balloons");
const colors=["#ff6b6b","#ffd166","#06d6a0","#4dabf7","#c77dff"];

function createBalloon(){
  const b=document.createElement("div");
  b.className="balloon";
  b.style.left=Math.random()*100+"vw";
  b.style.background=colors[Math.floor(Math.random()*colors.length)];
  b.style.animationDuration=10+Math.random()*10+"s";
  balloons.appendChild(b);
  setTimeout(()=>b.remove(),20000);
}
setInterval(createBalloon,600);

/* FIREWORKS */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}
resize();
window.onresize=resize;

function firework(x,y){
  for(let i=0;i<40;i++){
    ctx.fillStyle="#d4af37";
    ctx.beginPath();
    ctx.arc(x+Math.random()*60-30,y+Math.random()*60-30,2,0,Math.PI*2);
    ctx.fill();
  }
}
setInterval(()=>{
  firework(Math.random()*canvas.width,Math.random()*canvas.height*.6);
},1800);

/* CANDLE */
function blow(){
  document.getElementById("flame")?.remove();
  document.getElementById("smoke").classList.add("active");
  document.getElementById("poster").style.display="block";
  document.getElementById("poster").scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
