<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday</title>

<style>
:root{
  --gold:#d4af37;
  --text:rgba(255,255,255,.9);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  font-family:"Inter",system-ui,sans-serif;
  background:#05060f;
  overflow:hidden;
  color:var(--text);
}

/* BACKGROUND */
.bg{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 10%,#1a1d3a,transparent 60%),
    radial-gradient(circle at 80% 30%,#2a1b3d,transparent 55%),
    radial-gradient(circle at 50% 80%,#11152d,transparent 60%),
    linear-gradient(#05060f,#05060f);
  z-index:0;
}

/* FIREWORK CANVAS */
canvas{
  position:fixed;
  inset:0;
  z-index:1;
  opacity:.55;
}

/* PASSWORD SCREEN */
#password-screen{
  position:fixed;
  inset:0;
  z-index:3;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(5,6,15,.85);
  backdrop-filter:blur(18px);
}

.password-box{
  text-align:center;
  padding:40px 30px;
  border-radius:28px;
  background:rgba(255,255,255,.08);
  box-shadow:0 30px 80px rgba(0,0,0,.6);
  animation:fadeIn 1.2s ease;
}

.password-box h1{
  font-size:32px;
  margin-bottom:10px;
  background:linear-gradient(90deg,var(--gold),#fff);
  -webkit-background-clip:text;
  color:transparent;
}

.password-box p{
  opacity:.8;
  margin-bottom:25px;
}

.password-box input{
  width:240px;
  padding:12px 16px;
  border-radius:18px;
  border:none;
  outline:none;
  font-size:16px;
  text-align:center;
}

.password-box button{
  margin-top:20px;
  padding:12px 28px;
  border-radius:20px;
  border:none;
  cursor:pointer;
  background:linear-gradient(90deg,var(--gold),#fff);
  font-size:15px;
}

.error{
  margin-top:15px;
  color:#ff9aa2;
  display:none;
}

.shake{
  animation:shake .4s;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}

@keyframes fadeIn{
  from{opacity:0;transform:scale(.95)}
  to{opacity:1;transform:scale(1)}
}

/* MAIN LAYOUT */
main{
  position:relative;
  z-index:2;
  height:100%;
  display:grid;
  grid-template-rows:auto 1fr auto;
  padding:40px 24px;
}

/* HEADER */
header{text-align:center}

header h1{
  font-size:clamp(32px,6vw,52px);
  font-weight:500;
  background:linear-gradient(90deg,var(--gold),#fff);
  -webkit-background-clip:text;
  color:transparent;
}

header h2{
  margin-top:10px;
  font-size:18px;
  font-weight:300;
  opacity:.85;
}

/* CENTER */
.center{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* CANDLE */
.candle-wrap{
  position:relative;
  width:70px;
  height:240px;
  cursor:pointer;
}

.candle{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:46px;
  height:170px;
  background:linear-gradient(to right,#f7f1e6,#eadfc8,#fff4dd);
  border-radius:24px;
  box-shadow:inset -6px 0 10px rgba(0,0,0,.25),
             inset 6px 0 10px rgba(255,255,255,.5);
}

.wick{
  position:absolute;
  bottom:170px;
  left:50%;
  transform:translateX(-50%);
  width:3px;
  height:22px;
  background:#222;
}

.flame{
  position:absolute;
  bottom:195px;
  left:50%;
  transform:translateX(-50%);
  width:30px;
  height:55px;
  background:radial-gradient(
    ellipse at center,
    #fffbd5 0%,
    #ffd54f 40%,
    #ff9800 70%,
    #ff5722 100%
  );
  border-radius:50%;
  animation:flicker .14s infinite;
  filter:drop-shadow(0 0 45px rgba(255,160,60,.9));
}

.flame::after{
  content:"";
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  width:14px;
  height:26px;
  background:radial-gradient(circle,#fff,#fff59d,transparent);
  border-radius:50%;
}

@keyframes flicker{
  0%{transform:translateX(-50%) scale(1) rotate(-1deg)}
  50%{transform:translateX(-50%) scale(1.1) rotate(1deg)}
  100%{transform:translateX(-50%) scale(1) rotate(-1deg)}
}

.smoke{
  position:absolute;
  bottom:200px;
  left:50%;
  width:18px;
  height:18px;
  background:rgba(200,200,200,.6);
  border-radius:50%;
  opacity:0;
}

.smoke.active{
  animation:smoke 3.5s ease forwards;
}

@keyframes smoke{
  from{opacity:.7;transform:translate(-50%,0) scale(1)}
  to{opacity:0;transform:translate(-50%,-160px) scale(3)}
}

/* POSTER */
.poster{
  display:none;
  max-width:520px;
  margin-top:30px;
  animation:reveal 1.6s ease forwards;
}

.poster img{
  width:100%;
  border-radius:32px;
}

@keyframes reveal{
  from{opacity:0;transform:scale(.9)}
  to{opacity:1;transform:scale(1)}
}

/* FOOTER */
footer{
  text-align:center;
  max-width:520px;
  margin:0 auto;
  font-size:16px;
  line-height:1.6;
  opacity:.9;
}
</style>
</head>

<body>

<div class="bg"></div>
<canvas id="fireworks"></canvas>

<!-- 🔐 PASSWORD SCREEN -->
<div id="password-screen">
  <div class="password-box" id="box">
    <h1>Private Access</h1>
    <p>Enter the password to continue</p>
    <input type="password" id="password" placeholder="Password">
    <br>
    <button onclick="checkPassword()">Unlock</button>
    <div class="error" id="error">Wrong password</div>
  </div>
</div>

<main>
  <header>
    <h1>Happy Birthday</h1>
    <!-- ✏️ CHANGE NAME -->
    <h2>Dear Alex</h2>
  </header>

  <section class="center">
    <div class="candle-wrap" onclick="blow()">
      <div class="flame" id="flame"></div>
      <div class="wick"></div>
      <div class="candle"></div>
      <div class="smoke" id="smoke"></div>
    </div>

    <div class="poster" id="poster">
      <img src="poster.jpg" alt="Birthday Poster">
    </div>
  </section>

  <!-- ✏️ CHANGE MESSAGE -->
  <footer>
    May your days be calm, meaningful, and filled with warmth.  
    May joy follow you quietly, always.
  </footer>
</main>

<script>
/* 🔑 CHANGE PASSWORD HERE */
const PASSWORD = "birthday123";

/* PASSWORD CHECK */
function checkPassword(){
  const input=document.getElementById("password").value;
  const error=document.getElementById("error");
  const box=document.getElementById("box");

  if(input===PASSWORD){
    document.getElementById("password-screen").style.display="none";
  }else{
    error.style.display="block";
    box.classList.add("shake");
    setTimeout(()=>box.classList.remove("shake"),400);
  }
}

/* FIREWORKS */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}
resize();
window.onresize=resize;

function firework(x,y){
  const colors=["#d4af37","#ffffff","#c77dff"];
  const p=[];
  for(let i=0;i<55;i++){
    p.push({
      x,y,
      a:Math.random()*Math.PI*2,
      s:Math.random()*4+1,
      r:Math.random()*2+1,
      c:colors[Math.floor(Math.random()*colors.length)],
      l:90
    });
  }
  (function anim(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    p.forEach(o=>{
      o.x+=Math.cos(o.a)*o.s;
      o.y+=Math.sin(o.a)*o.s;
      o.l--;
      ctx.beginPath();
      ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
      ctx.fillStyle=o.c;
      ctx.fill();
    });
    if(p.some(o=>o.l>0))requestAnimationFrame(anim);
  })();
}

setInterval(()=>{
  firework(Math.random()*canvas.width,Math.random()*canvas.height*.55);
},2000);

/* BLOW */
function blow(){
  document.getElementById("flame")?.remove();
  document.getElementById("smoke").classList.add("active");
  document.getElementById("poster").style.display="block";

  for(let i=0;i<5;i++){
    setTimeout(()=>firework(
      Math.random()*canvas.width,
      Math.random()*canvas.height*.55
    ),i*400);
  }
}
</script>

</body>
</html>
